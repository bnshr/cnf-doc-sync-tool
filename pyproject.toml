[project]
name = "cnf-doc-sync-ui"
version = "0.1.0"
description = "Review UI for CNF documentation sync between private and public repos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["cnf_doc_sync_ui*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
